version: '3.8'

services:
  mqtt:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
    networks:
      - mining-net

  influxdb:
    image: influxdb:2.0
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=xiankejidaxue
      - DOCKER_INFLUXDB_INIT_BUCKET=wasi
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - ./influxdb-init:/docker-entrypoint-initdb.d
    networks:
      - mining-net

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - MQTT_BROKER=mqtt
    depends_on:
      - mqtt
      - influxdb
    networks:
      - mining-net

networks:
  mining-net:
    driver: bridge

volumes:
  mosquitto_data:
  influxdb_data: