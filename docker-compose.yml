# 删除废弃的 version 声明（Compose V2 不再需要）
services:
  mqtt:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
    
    networks:
      - mining-net

  influxdb:
    image: influxdb:2.0
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: root
      DOCKER_INFLUXDB_INIT_PASSWORD: qwertyuiop,.?
      DOCKER_INFLUXDB_INIT_ORG: xiankejidaxue
      DOCKER_INFLUXDB_INIT_BUCKET: wasi
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}  # 从 .env 文件读取
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - ./influxdb-init:/docker-entrypoint-initdb.d
    networks:
      - mining-net

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:  # 正确环境变量语法（键值对，统一使用冒号+空格）
      INFLUXDB_URL: "http://influxdb:8086"
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}  # 从 .env 文件读取
      MQTT_USERNAME: "root"
      MQTT_PASSWORD: "qwertyuiop,.?"
      MQTT_BROKER: "mqtt"  # 使用双引号闭合
      PYTHONPATH: "/app"
    depends_on:
      - mqtt
      - influxdb
    networks:
      - mining-net

networks:
  mining-net:
    driver: bridge

volumes:
  mosquitto_data:
  influxdb_data: